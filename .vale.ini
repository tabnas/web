# House voice, then Google, then Vale. Adapted from Voxgig and aontu.
StylesPath = .vale/styles
MinAlertLevel = warning
Vocab = Tabnas
Packages = https://github.com/errata-ai/Google/releases/download/v0.7.1/Google.zip

[*.{md,html}]
BasedOnStyles = Vale, Google, Tabnas
Vale.Spelling = error
Vale.Avoid = error
Tabnas.WordChoice = error
Google.Latin = error
Google.Ellipses = error
# The house guide uses British spelling and allows tutorial "we".
# Named project history may use the maintainer's own voice.
Google.Spelling = NO
Google.We = NO
Google.FirstPerson = NO
# Node rejects em dashes outright, so spacing advice is redundant.
Google.EmDash = NO
# Advisory house choices, inherited from the source guides; these do not
# replace the editorial review of claims, sentence case, or sentence length.
Google.Passive = suggestion
Google.Contractions = suggestion
Google.Parens = suggestion
Google.Semicolons = suggestion
Google.OxfordComma = warning
Google.Exclamation = warning
Google.ExcessiveClaims = warning
Google.Anthropomorphism = warning
# "touch" means a file operation here, not a touchscreen gesture.
Google.WordListCase = warning
Google.WordList = warning
# Parser references use named APIs, ABNF, JSON, and CLI without expansion.
Google.Acronyms = warning
Google.Colons = warning
Google.Headings = warning
# British punctuation puts punctuation outside quoted literals.
Google.Quotes = warning
Google.LyHyphens = warning
Google.Units = warning
Google.Will = warning
Google.Timeless = warning

# The historical chess date uses British day-month-year order.
Google.DateFormat = warning
