# House voice, then Google, then Vale. Adapted from Voxgig and aontu.
#
# Every count below is what Vale reports on a clean run over the built
# pages and the README: 1414 alerts across 99 files. A rule demoted
# without that number reads later as an oversight and gets re-promoted
# by somebody repeating the work, and a number nothing re-measures goes
# stale the first time a page is edited. `node tools/vale-counts.mjs`
# checks every one of them against a live run, `--write` re-measures,
# and `npm run prose` fails on drift.
StylesPath = .vale/styles
MinAlertLevel = warning
Vocab = Tabnas
Packages = https://github.com/errata-ai/Google/releases/download/v0.7.1/Google.zip

[*.{md,html}]
BasedOnStyles = Vale, Google, Tabnas

# --- The gate ---------------------------------------------------------
#
# Error level, and these fail the build. 0 hits between them: they are
# conventions an author has no reason to vary.
Vale.Spelling = error
Vale.Avoid = error
Tabnas.WordChoice = error
Google.Latin = error
Google.Ellipses = error

# --- Overrides where the house voice wins -----------------------------

# British spellings. Google style is US English and the house guide is
# not. 100 hits with the rule on, every one of them deliberate; actual
# misspellings are caught by Vale.Spelling, which stays at error.
Google.Spelling = NO

# "We" belongs in a tutorial and on the pages whose subject is this
# project. Vale cannot say that, so the rule is off here and
# `register()` in tools/prose.mjs carries it, page by page. 4 hits with
# the rule on, all of them the allowed kind.
Google.We = NO

# "I" belongs in a question in the reader's voice, and nowhere else.
# `register()` carries that too, and knows a question from a statement.
# 17 hits with the rule on, all of them the reader asking.
Google.FirstPerson = NO

# The Node half rejects em dashes outright, so Google's advice on the
# space around one is redundant. 0 hits.
Google.EmDash = NO

# --- Demoted on evidence, not on taste --------------------------------
#
# Each was read against the real pages. The count is what it produced on
# a clean run.

# Contractions are a register choice per page kind: a tutorial
# contracts, a reference does not. 356 hits, none of them defects.
Google.Contractions = suggestion

# The occasional passive keeps a sentence's subject on the thing being
# documented ("the token is discarded"). 288 hits.
Google.Passive = suggestion

# The guide rations parentheses more precisely than "use parentheses
# judiciously" can: definitions, caveats, one dry aside per page. 179
# hits.
Google.Parens = suggestion

# A semicolon joining two independent clauses is part of the long
# explanatory sentence the guide allows. 118 hits.
Google.Semicolons = suggestion

# Wants an unfamiliar acronym spelled out. 230 hits, none a defect: 115
# are `MIT` (98 of them the footer's licence line), 25 `RFC` and 19
# `ABI`, and the rest are names this site's readers already know
# (`TSV`, `ANTLR`, `PGN`, `PEG`, `JVM`, and the like) or literals
# (`ERROR` in an `ERROR:<code>` row, `SKILL` in `SKILL.md`).
Google.Acronyms = warning

# "Use 'command-line tool' instead of 'CLI'." All 22 hits are `CLI`.
# The audience runs the command-line tool and calls it a CLI.
Google.WordList = warning

# Maps `touch` to `tap`, a mobile-UI rule, and `above`/`below` to
# `preceding`/`following`. 48 hits, of which 23 are `above` (18 an
# ordinary cross-reference, 5 the comparison "greater than") and 8
# each are `admin` and `regex`.
Google.WordListCase = warning

# Sentence case in headings, which the guide requires. It cannot tell a
# proper noun ("In the C ABI", "In Claude Code") from a sentence, and it
# reads a numbered step ("3 · Parse") as a heading that starts wrong. 37
# hits.
Google.Headings = warning

# "Avoid using 'will'." 24 hits, each on a consequence that follows
# later: what the next call returns, what the page does next.
Google.Will = warning

# Serial commas, which the guide requires. 34 hits, and none is a
# series in this site's own prose that lacks one. 32 are false: 31
# two-item lists or pairs sitting after a comma clause, which the rule
# cannot tell from a series (20 of them the xml package's generated
# description), and one `and` inside a longer item. The other 2 are a
# series without the serial comma in the skills data, generated from
# the skills repo, so the fix belongs there.
Google.OxfordComma = warning

# Fires on a colon followed by a capital. 30 hits, none a defect: 22
# are names or acronyms (`MIT`, `Zig`, `Go`, `JSON5`, `CI`, `Irish`,
# and the rest), and 8 are a label followed by its own description,
# as in "Agent Skill: Author a tabnas GrammarSpec".
Google.Colons = warning

# "Avoid the unverifiable claim 'guarantee'." 21 hits, and the subject
# matter is what a parser promises about a grammar: 14 are `guarantee`
# or `guarantees`. Of the rest, 6 are `fastest`, five of them "the
# fastest way to" do a task the sentence names and one the disclaimer
# that tabnas is not the fastest parser for every workload, and 1 is
# the compound `best-effort`.
Google.ExcessiveClaims = warning

# Flags "sees" and "tells" as attributing human qualities to software.
# 14 hits, 8 on `sees` and 6 on `tells`, and several are about PEOPLE,
# which the rule cannot tell apart from "the lexer sees".
Google.Anthropomorphism = warning

# US convention: commas and periods INSIDE the quotation marks. The
# house voice is not US English, and putting a period inside a quoted
# literal is actively wrong. 11 hits.
Google.Quotes = warning

# The guide allows one exclamation mark per page, on a tutorial payoff;
# Google bans them outright. 0 hits, and the ration is carried by
# `register()`, which knows which page is which.
Google.Exclamation = warning

# Flags an `-ly` adverb before a hyphen, a real error class it cannot
# tell from a word that merely ends in those letters. 0 hits.
Google.LyHyphens = warning

# "Put a nonbreaking space between the number and the unit." 0 hits.
Google.Units = warning

# "Avoid time-based words like 'currently'." 1 hit, on a version that is
# expected to change, which is the case the word is for.
Google.Timeless = warning

# The historical chess date uses British day-month-year order. 1 hit,
# `21 June 1851`.
Google.DateFormat = warning
