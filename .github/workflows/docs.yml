name: Prose gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: node --test test/prose-extraction.test.mjs
      - name: Install pinned Vale
        run: |
          curl -fLsS -o /tmp/vale.tar.gz \
            https://github.com/errata-ai/vale/releases/download/v3.9.1/vale_3.9.1_Linux_64-bit.tar.gz
          tar -xzf /tmp/vale.tar.gz -C /tmp vale
          /tmp/vale --version
      - name: Fetch pinned Google rules
        run: /tmp/vale sync
      - name: Check rendered prose and README
        env:
          VALE: /tmp/vale
        run: npm run prose
